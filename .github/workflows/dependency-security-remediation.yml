name: Dependency Security Remediation

on:
  push:
    branches:
      - security/dependency-remediation-2026-08-13

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Prepare targeted security constraints
        run: node scripts/security-remediate-dependencies.mjs

      - name: Refresh npm dependency graph
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm update --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Refresh Cargo dependency graph
        working-directory: cli
        run: cargo update

      - name: Generate remediation evidence
        run: node scripts/security-remediate-dependencies.mjs --report

      - name: Validate lockfiles parse
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package-lock.json','utf8')); console.log('package-lock.json OK')"
          cargo metadata --manifest-path cli/Cargo.toml --locked --no-deps --format-version 1 >/dev/null

      - name: Commit generated dependency updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json cli/Cargo.toml cli/Cargo.lock SECURITY_REMEDIATION_2026-08-13.md
          if git diff --cached --quiet; then
            echo "No dependency changes generated."
            exit 0
          fi
          git commit -m "chore(security): remediate Dependabot dependency alerts"
          git push origin HEAD:${GITHUB_REF_NAME}
