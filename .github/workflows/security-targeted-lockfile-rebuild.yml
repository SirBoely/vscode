name: Security Targeted Lockfile Rebuild

on:
  push:
    branches:
      - security/dependency-remediation-2026-08-13

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Linux native build prerequisites
        run: |
          sudo apt update
          sudo apt install -y build-essential g++ libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev python-is-python3 pkg-config

      - name: Restore VS Code 1.96 lockfile baseline
        run: |
          git fetch origin main --depth=1
          git show FETCH_HEAD:package-lock.json > package-lock.json

      - name: Apply only manifest security changes to lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate resolved compatibility anchors
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          for (const name of ['typescript','@webgpu/types','@types/node','eslint-visitor-keys','@electron/get','braces','tar','tar-fs','@octokit/request']) {
            const suffix = `node_modules/${name}`;
            const rows = Object.entries(lock.packages ?? {})
              .filter(([path, meta]) => meta?.version && (path === suffix || path.endsWith(`/${suffix}`)))
              .map(([path, meta]) => `${name} ${meta.version} ${path}`);
            console.log(rows.join('\n') || `${name}: not present`);
          }
          NODE

      - name: Validate clean full install
        run: npm ci --no-audit --no-fund

      - name: Validate Monaco compile compatibility
        run: npm run monaco-compile-check

      - name: Commit targeted lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes generated."
            exit 0
          fi
          git commit -m "fix(deps): preserve VS Code 1.96 dependency compatibility"
          git push origin HEAD:${GITHUB_REF_NAME}
