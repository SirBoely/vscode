name: Security Lockfile Repair

on:
  push:
    branches:
      - security/dependency-remediation-2026-08-13

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Normalize braces security override
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          delete pkg.overrides['braces@<3.0.3'];
          pkg.overrides.braces = '3.0.3';
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate clean install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate braces resolution
        run: npm ls braces --all

      - name: Commit repaired manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No changes generated."
            exit 0
          fi
          git commit -m "fix(deps): make security overrides npm-ci reproducible"
          git push origin HEAD:${GITHUB_REF_NAME}
